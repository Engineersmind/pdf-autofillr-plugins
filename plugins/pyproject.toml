[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-autofillr-plugins"
version = "0.2.0"
description = "Plugin framework for pdf-autofillr — extend extractors, mappers, validators, fillers, and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Engineers Mind", email = "Support@pdffillr.ai"}
]
keywords = ["pdf", "plugin", "framework", "extensible", "autofill", "form-filling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business",
]

# Zero runtime dependencies — pure Python plugin framework
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pdf-autofillr-plugins = "pdf_autofillr_plugins.cli:main"

[project.urls]
Homepage      = "https://github.com/Engineersmind/pdf-autofillr-plugins"
Documentation = "https://github.com/Engineersmind/pdf-autofillr-plugins/blob/main/plugins/USAGE.md"
Repository    = "https://github.com/Engineersmind/pdf-autofillr-plugins"
Issues        = "https://github.com/Engineersmind/pdf-autofillr-plugins/issues"
Platform      = "https://pdffillr.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_autofillr_plugins = ["USAGE.md", "usage/*.md"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--tb=short"]
