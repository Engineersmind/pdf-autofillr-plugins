name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: cd packages/plugins && pip install -e ".[dev]"
      - name: Test
        run: cd packages/plugins && pytest tests/ -v --tb=short
      - name: Coverage
        if: matrix.python-version == '3.12'
        run: cd packages/plugins && pytest tests/ --cov=src/pdf_autofillr_plugins --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: packages/plugins/coverage.xml
