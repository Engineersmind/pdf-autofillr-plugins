name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type check / Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Convert line endings to LF
        run: find src/ tests/ -name "*.py" -exec sed -i 's/\r//' {} +

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Black format check
        run: black --check src/ tests/

      - name: isort check
        run: isort --check-only src/ tests/

      - name: Mypy type check
        run: mypy src/pdf_autofillr_plugins --ignore-missing-imports

  dependency-check:
    name: Dependency check / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: plugins

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (no extras)
        run: pip install .

      - name: Verify zero runtime deps
        run: |
          DEPS=$(pip show pdf-autofillr-plugins | grep ^Requires | sed 's/Requires: //')
          echo "Runtime deps: '$DEPS'"
          [ -z "$DEPS" ] || (echo "ERROR — unexpected runtime dependencies detected" && exit 1)